name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (format vX.X.X, e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}', expected format vX.X.X (e.g. v1.2.3)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag does not already exist
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Create release branch
        run: |
          git checkout -b "release/${{ inputs.version }}"
          git push origin "release/${{ inputs.version }}"

      - name: Build datapack zip
        run: |
          mkdir -p dist/package
          cp -r data dist/package/data
          cp LICENSE dist/package/LICENSE
          cp README.md dist/package/README.md
          cp pack.mcmeta dist/package/pack.mcmeta
          cd dist/package
          zip -r "../minionskyblock-${{ inputs.version }}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: release/${{ inputs.version }}
          name: MinionSkyBlock ${{ inputs.version }}
          generate_release_notes: true
          files: dist/minionskyblock-${{ inputs.version }}.zip
